name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[test]"
      - run: pytest -q
      - run: penpad demo -o demo.pdf
      - run: penpad render examples/physics-notes.md -o physics.png --paper a4-lines --style print

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t penpad .
      - run: docker run --rm -v "$PWD:/work" penpad render examples/physics-notes.md -o /work/out.pdf && test -s out.pdf
